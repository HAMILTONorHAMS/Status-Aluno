<h1>Classificador de Alunos</h1>
<app-aluno
  *ngFor="let item of alunos"
  [aluno]="item"
  (statusAlterado)="atualizaStatus($event)">
  <!--Toda vez que emitimos com output, a fn atualizaStatus é chamada, recebendo o evento contendo os dados vindo da funcao, assim a fn atualizaStatus cria um novo array com o novo status -->
</app-aluno>
