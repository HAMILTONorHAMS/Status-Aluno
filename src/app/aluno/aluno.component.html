<div>
  <h2>Adicionar Novo Aluno</h2>
  <form (ngSubmit)="adicionar()">
    <label>
      Nome:
      <input type="text" [(ngModel)]="nome" name="nome" required />
    </label>

    <label>
      Nota:
      <input type="number" [(ngModel)]="nota" name="nota" required />
    </label>

    <button type="submit">Adicionar</button>
  </form>
</div>
