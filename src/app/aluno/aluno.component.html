<div class="class">
  <article>
    <strong>Nome:</strong>{{aluno?.nome}} <!--Usa interpolação para pegar informações do Input-->
  </article>
  <br>
  <article>
    <strong>Nota:</strong>{{aluno?.nota}}
  </article>
  <br>
  <article > <!--Se um aluno for pedente não mostra o status-->
    <strong>Status:</strong>{{aluno?.status}}
  </article>
  <div >
    <button (click)="aprovarFn()">Aprovado</button>
    <button (click)="reprovarFn()">Reprovado</button>
  </div>
  <hr>
</div>
